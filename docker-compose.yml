services:
  postgres:
    image: postgres:17-alpine
    container_name: broth-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: broth
      POSTGRES_PASSWORD: broth
      POSTGRES_DB: broth_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broth"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
